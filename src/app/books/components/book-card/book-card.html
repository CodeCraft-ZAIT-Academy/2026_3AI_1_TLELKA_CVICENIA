<mat-card
  class="book-card"
  [class.unavailable]="!book().available"
  [class.favorite]="book().favorite"
  [style.border-left-color]="genreColor()">

  <mat-card-header>

    <span
      class="genre-icon"
      mat-card-avatar
      [style.color]="genreColor()">

      <mat-icon>menu_book</mat-icon>

    </span>

    <mat-card-title>
      {{ book().title }}
    </mat-card-title>

    <mat-card-subtitle>
      {{ book().author }}
    </mat-card-subtitle>

  </mat-card-header>

  <mat-card-content>

    @if (book().available) {
      <p>Kniha je dostupná.</p>
    } @else {
      <p>Kniha je momentálne vypožičaná.</p>
    }

  </mat-card-content>

  <mat-card-actions>

    <a
      matButton
      [routerLink]="['/books', book().id]">
      Detail
    </a>

    <button
      matButton="filled"
      [disabled]="!book().available"
      (click)="borrow()">
      Vypožičať
    </button>

    @if (!book().available) {
      <button
        matButton="outlined"
        (click)="giveBack()">
        Vrátiť
      </button>
    }

    <button
      matIconButton
      (click)="toggleFavorite()"
      [attr.aria-label]="book().favorite ? 'Odobrať z obľúbených' : 'Pridať medzi obľúbené'">

      @if (book().favorite) {
        <mat-icon class="favorite-icon">star</mat-icon>
      } @else {
        <mat-icon>star_border</mat-icon>
      }

    </button>

  </mat-card-actions>

</mat-card>
